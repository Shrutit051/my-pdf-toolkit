{% extends "base.html" %}

{% block title %}Split PDF{% endblock %}

{% block content %}
<div class="card">
    <h1 class="page-title">✂️ Split PDF</h1>
    <p class="page-subtitle">Extract specific pages from a PDF</p>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Upload PDF</label>
            <input type="file" name="file" class="form-control form-control-file" accept=".pdf" required>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Start Page</label>
                <input type="number" name="start_page" class="form-control" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label>End Page</label>
                <input type="number" name="end_page" class="form-control" value="1" min="1" required>
            </div>
        </div>
        <button type="submit" class="btn btn-success">✂️ Split</button>
    </form>
</div>
{% endblock %}
